<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Manager - Automatický Výkaz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="number"],
        input[type="time"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="number"]:focus,
        input[type="time"]:focus,
        input[type="email"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .recipients-list {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            min-height: 40px;
        }

        .recipient-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            margin: 3px;
            font-size: 12px;
        }

        .recipient-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            margin-left: 5px;
            font-weight: bold;
        }

        .add-recipient {
            display: flex;
            gap: 10px;
        }

        .add-recipient input {
            flex: 1;
        }

        .add-recipient button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }

        .add-recipient button:hover {
            background: #5568d3;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            flex: none;
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .status-partial {
            background: #fff3cd;
            color: #856404;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .preview-frame {
            width: 100%;
            min-height: 800px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 20px;
        }

        .report-summary {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .report-summary strong {
            color: #d9534f;
            font-size: 18px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #000;
        }

        .report-preview {
            font-family: Arial, sans-serif;
            padding: 40px;
            line-height: 1.6;
            color: #333;
        }

        .report-preview h1 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 30px;
        }

        .report-preview p {
            margin-bottom: 15px;
            text-align: justify;
            font-size: 14px;
        }

        .report-preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .report-preview th {
            border: 1px solid #333;
            padding: 12px;
            background: #f5f5f5;
            text-align: left;
            font-weight: bold;
        }

        .report-preview td {
            border: 1px solid #333;
            padding: 12px;
        }

        .report-preview .total-row {
            font-weight: bold;
            background: #f9f9f9;
        }

        .report-preview .signature {
            margin-top: 30px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Report Manager</h1>
            <p class="subtitle">Správa automatického měsíčního výkazu</p>
        </header>

        <div id="alerts"></div>

        <div class="grid">
            <!-- Nastavení -->
            <div class="card">
                <h2>⚙️ Nastavení</h2>

                <div class="form-group">
                    <label>Den odesílání v měsíci:</label>
                    <input type="number" id="scheduleDay" min="1" max="31" value="1">
                </div>

                <div class="form-group">
                    <label>Čas odesílání:</label>
                    <input type="time" id="scheduleTime" value="08:00">
                </div>

                <div class="form-group">
                    <label>Hodinová sazba (Kč):</label>
                    <input type="number" id="hourlyRate" min="0" step="0.01" value="350">
                </div>

                <div class="form-group">
                    <label>Příjemci emailu:</label>
                    <div class="recipients-list" id="recipientsList"></div>
                </div>

                <div class="form-group add-recipient">
                    <input type="email" id="newRecipient" placeholder="Zadej email...">
                    <button onclick="addRecipient()">Přidat</button>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="enableSchedule" checked>
                    <label for="enableSchedule">Povolit automatické odesílání</label>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="saveConfig()">💾 Uložit nastavení</button>
                    <button class="btn-secondary" onclick="testConnection()">🔗 Test připojení</button>
                </div>
            </div>

            <!-- Ovládání -->
            <div class="card">
                <h2>🚀 Akce</h2>

                <button class="btn-success" style="width: 100%; margin-bottom: 10px; padding: 15px;" onclick="sendReportNow()">
                    📤 Odeslat report nyní
                </button>

                <button class="btn-primary" style="width: 100%; margin-bottom: 10px; padding: 15px;" onclick="loadFullPreview()">
                    👁️ Náhled finálního reportu
                </button>

                <button class="btn-primary" style="width: 100%; margin-bottom: 10px; padding: 15px;" onclick="loadPreview()">
                    📋 Náhled dat z Kimai
                </button>
            </div>
        </div>

        <!-- Historie -->
        <div class="card">
            <h2>📜 Historie reportů</h2>
            <div id="historyContainer"></div>
        </div>
    </div>

    <!-- Modal pro náhled -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="reportContent"></div>
        </div>
    </div>

    <script>
        // Načti konfiguraci
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();

                document.getElementById('scheduleDay').value = config.schedule_day;
                document.getElementById('scheduleTime').value = config.schedule_time;
                document.getElementById('hourlyRate').value = config.hourly_rate;
                document.getElementById('enableSchedule').checked = config.enabled;

                displayRecipients(config.recipients);
            } catch (error) {
                showAlert('Chyba při načítání konfigurace: ' + error, 'error');
            }
        }

        // Zobraz příjemce
        function displayRecipients(recipients) {
            const list = document.getElementById('recipientsList');
            list.innerHTML = '';

            recipients.forEach((email, index) => {
                const tag = document.createElement('span');
                tag.className = 'recipient-tag';
                tag.innerHTML = `${email} <button onclick="removeRecipient(${index})" type="button">×</button>`;
                list.appendChild(tag);
            });
        }

        // Přidej příjemce
        function addRecipient() {
            const input = document.getElementById('newRecipient');
            const email = input.value.trim();

            if (!email) {
                showAlert('Zadej email', 'error');
                return;
            }

            if (!email.includes('@')) {
                showAlert('Zadej platný email', 'error');
                return;
            }

            const list = document.getElementById('recipientsList');
            const recipients = Array.from(list.querySelectorAll('.recipient-tag')).map(tag => {
                return tag.textContent.replace('×', '').trim();
            });

            if (recipients.includes(email)) {
                showAlert('Tento email už je přidaný', 'error');
                return;
            }

            recipients.push(email);
            displayRecipients(recipients);
            input.value = '';
        }

        // Odstraň příjemce
        function removeRecipient(index) {
            const list = document.getElementById('recipientsList');
            const recipients = Array.from(list.querySelectorAll('.recipient-tag')).map(tag => {
                return tag.textContent.replace('×', '').trim();
            });

            recipients.splice(index, 1);
            displayRecipients(recipients);
        }

        // Ulož konfiguraci
        async function saveConfig() {
            const scheduleDay = parseInt(document.getElementById('scheduleDay').value);
            const scheduleTime = document.getElementById('scheduleTime').value;
            const hourlyRate = parseFloat(document.getElementById('hourlyRate').value);
            const enableSchedule = document.getElementById('enableSchedule').checked;

            const list = document.getElementById('recipientsList');
            const recipients = Array.from(list.querySelectorAll('.recipient-tag')).map(tag => {
                return tag.textContent.replace('×', '').trim();
            });

            if (recipients.length === 0) {
                showAlert('Musí být alespoň jeden příjemce', 'error');
                return;
            }

            if (hourlyRate <= 0) {
                showAlert('Hodinová sazba musí být větší než 0', 'error');
                return;
            }

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        schedule_day: scheduleDay,
                        schedule_time: scheduleTime,
                        recipients: recipients,
                        enabled: enableSchedule,
                        hourly_rate: hourlyRate
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('✓ Nastavení uloženo', 'success');
                } else {
                    showAlert('Chyba: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Chyba při ukládání: ' + error, 'error');
            }
        }

        // Odešli report teď
        async function sendReportNow() {
            if (!confirm('Opravdu chceš nyní odeslat report?')) return;

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Odesílám...';

            try {
                const response = await fetch('/api/send-report', { method: 'POST' });
                const result = await response.json();

                if (response.ok) {
                    showAlert('✓ Report byl úspěšně odeslán', 'success');
                    loadHistory();
                } else {
                    showAlert('Chyba: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Chyba při odesílání: ' + error, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '📤 Odeslat report nyní';
            }
        }

        // Zobraz náhled dat
        async function loadPreview() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Načítám...';

            try {
                const response = await fetch('/api/preview');
                const result = await response.json();

                if (response.ok && result.data.length > 0) {
                    let html = '<h3>Náhled dat z Kimai:</h3>';
                    html += '<table class="preview-table" style="width: 100%; margin-top: 15px;">';
                    html += '<tr><th>Datum</th><th>Od – Do</th><th>Hodiny</th></tr>';

                    let totalHours = 0;
                    result.data.forEach(row => {
                        const [h, m] = row.duration.split(':');
                        const hours = parseInt(h) + (parseInt(m) / 60);
                        totalHours += hours;
                        html += `<tr><td>${row.date}</td><td>${row.from} – ${row.to}</td><td>${hours.toFixed(2)}</td></tr>`;
                    });

                    html += `<tr style="font-weight: bold; background: #f0f0f0;"><td colspan="2">Celkem</td><td>${totalHours.toFixed(2)}</td></tr>`;
                    html += '</table>';

                    openModal(html);
                } else {
                    showAlert('Žádná data k náhledu', 'info');
                }
            } catch (error) {
                showAlert('Chyba: ' + error, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '📋 Náhled dat z Kimai';
            }
        }

        // Zobraz finální report
        async function loadFullPreview() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Generuji náhled...';

            try {
                const response = await fetch('/api/preview-full');
                const result = await response.json();

                if (response.ok) {
                    const content = `
                        <div class="report-summary">
                            <p>Celkový počet hodin: <strong>${result.worked_hours.toFixed(2)}</strong></p>
                            <p>Hodinová sazba: <strong>${result.hourly_rate.toFixed(2)} Kč</strong></p>
                            <p>Celková částka: <strong style="color: #d9534f; font-size: 18px;">${result.total_price.toFixed(2)} Kč</strong></p>
                        </div>
                        <div class="report-preview">
                            ${result.html}
                        </div>
                    `;
                    openModal(content);
                } else {
                    showAlert('Chyba: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Chyba: ' + error, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '👁️ Náhled finálního reportu';
            }
        }

        // Modal funkce
        function openModal(content) {
            document.getElementById('reportContent').innerHTML = content;
            document.getElementById('reportModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('reportModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('reportModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Načti historii
        async function loadHistory() {
            try {
                const response = await fetch('/api/history?limit=20');
                const result = await response.json();
                const container = document.getElementById('historyContainer');

                if (result.history.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Žádné záznamy v historii</p></div>';
                    return;
                }

                let html = '<div class="table-container"><table>';
                html += '<tr><th>Datum</th><th>Stav</th><th>Příjemci</th><th>Soubor</th></tr>';

                result.history.forEach(item => {
                    const date = new Date(item.sent_date).toLocaleString('cs-CZ');
                    const statusClass = item.status === 'success' ? 'status-success' :
                                       item.status === 'failed' ? 'status-failed' : 'status-partial';
                    const statusText = item.status === 'success' ? 'Úspěšně' :
                                      item.status === 'failed' ? 'Selhalo' : 'Částečně';

                    html += `<tr>
                        <td>${date}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${item.recipients.join(', ')}</td>
                        <td>${item.file_name || '-'}</td>
                    </tr>`;
                });

                html += '</table></div>';
                container.innerHTML = html;
            } catch (error) {
                document.getElementById('historyContainer').innerHTML =
                    '<div class="alert alert-error">Chyba při načítání: ' + error + '</div>';
            }
        }

        // Test připojení
        async function testConnection() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Testuji...';

            try {
                const response = await fetch('/api/preview');
                if (response.ok) {
                    showAlert('✓ Připojení OK', 'success');
                } else {
                    showAlert('✗ Chyba připojení', 'error');
                }
            } catch (error) {
                showAlert('✗ Nemohu se připojit: ' + error, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔗 Test připojení';
            }
        }

        // Zobraz zprávu
        function showAlert(message, type) {
            const container = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }

        // Init
        window.addEventListener('load', () => {
            loadConfig();
            loadHistory();
        });

        // Umožni Enter na inputu pro email
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('newRecipient');
            if (input) {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') addRecipient();
                });
            }
        });
    </script>
</body>
</html>
