services:
  kimai-report:
    image: fifa94/kimai-report:latest
    container_name: kimai-report
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Konfigurace (příjemci, den, čas, sazba) se ukládá sem, aby přežila update image
      - CONFIG_DB_PATH=/app/data/report_config.db
      - OUTPUT_DIR=/app/output
      - TZ=Europe/Prague
    volumes:
      - ./output:/app/output
      - kimai-report-config:/app/data

volumes:
  kimai-report-config:
